name: Marketplace checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Synthetic settings. E2E intercepts all backend requests; no live credentials.
      SEO_SKIP_PRODUCT_FETCH: "1"
      VITE_SUPABASE_URL: https://dtpi-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: artifacts/
